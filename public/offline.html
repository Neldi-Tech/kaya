<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaya — offline</title>
<style>
  body{margin:0;font-family:'Nunito',system-ui,-apple-system,sans-serif;background:#FDFBF7;color:#1E120B;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:340px;text-align:center;}
  .bee{font-size:56px;}
  h1{font-size:20px;font-weight:900;margin:14px 0 8px;}
  p{font-size:14px;line-height:1.55;color:#9B8A72;margin:0 0 20px;}
  button{background:#D4A017;color:#1E120B;border:none;border-radius:14px;padding:13px 26px;
         font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;}
  button:active{transform:scale(.98);}
</style>
</head>
<body>
  <div class="card">
    <div class="bee">🐝📴</div>
    <h1>No internet right now</h1>
    <p>Kaya keeps the pages you've visited saved on this phone — this one isn't saved yet.
       Everything you've done offline is safe and will sync by itself.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
